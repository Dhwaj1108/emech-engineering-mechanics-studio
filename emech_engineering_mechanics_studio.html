<style>
:root{--bg:#f6f8fb;--card:#fff;--ink:#172033;--muted:#667085;--blue:#2563eb;--blue2:#dbeafe;--green:#16a34a;--red:#dc2626;--amber:#d97706;--border:#dfe5ee;--shadow:0 2px 8px #00000012;--r:10px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:15px;align-items:end;border-bottom:2px solid var(--border);padding-bottom:15px}.top h1{margin:0;font-size:1.5rem}.top p{margin:4px 0 0;color:var(--muted);font-size:.85rem}.badge{padding:7px 10px;border-radius:20px;background:var(--blue2);color:#1d4ed8;font-weight:700;font-size:.75rem}.tabs{display:flex;gap:6px;overflow:auto;padding:14px 0}.tab{white-space:nowrap;border:1px solid var(--border);background:var(--card);padding:9px 13px;border-radius:7px;cursor:pointer;font-weight:650;color:var(--muted)}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.module{display:none;grid-template-columns:350px 1fr;gap:18px}.module.active{display:grid}@media(max-width:900px){.module.active{grid-template-columns:1fr}.app{padding:12px}.top{align-items:start;flex-direction:column}}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);margin-bottom:14px}.title{font-weight:750;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin-bottom:4px}.input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink)}.btn{border:1px solid var(--border);background:#fff;border-radius:6px;padding:8px 11px;cursor:pointer;font-weight:650}.primary{background:var(--blue);color:white;border-color:var(--blue)}.danger{color:var(--red)}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;align-items:end}.outgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--card)}.stat small{color:var(--muted);font-size:.68rem;font-weight:700;text-transform:uppercase}.stat strong{display:block;font-size:1.1rem;margin-top:3px}.canvas{width:100%;min-height:390px;background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}.canvas canvas{width:100%;height:390px;display:block}.steps{font-family:ui-monospace,SFMono-Regular,monospace;font-size:.82rem;line-height:1.7;white-space:pre-wrap}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.note{color:var(--muted);font-size:.78rem}.section{display:none}.section.active{display:block}.pillbar{display:flex;gap:6px;flex-wrap:wrap}.mini{font-size:.72rem;padding:5px 8px;background:#f1f5f9;border-radius:5px}.formula{background:#f8fafc;border-left:3px solid var(--blue);padding:10px;font-family:monospace;font-size:.8rem}.check{display:flex;gap:8px;align-items:center;font-size:.82rem;margin-top:8px}.hero{background:linear-gradient(120deg,#eff6ff,#fff);border:1px solid #bfdbfe;padding:14px;border-radius:10px;margin-bottom:14px}.hero b{color:#1d4ed8}.range{width:100%}

/* Responsive canvas rendering and interaction affordances */
.canvas { min-height: 0; }
.canvas canvas { width: 100%; height: clamp(260px, 38vw, 390px); display: block; }
#forceCanvas { cursor: grab; touch-action: none; }
#forceCanvas:active { cursor: grabbing; }
.canvas-help { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:10px; }
.legend { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:.76rem; }
.legend span { display:inline-flex; align-items:center; gap:5px; }
.legend i { width:9px; height:9px; display:inline-block; border-radius:50%; }
.canvas-note { color:var(--muted); font-size:.76rem; }
@media(max-width:600px) { .canvas canvas { height:280px; } .canvas-help { align-items:flex-start; } }
</style></head><body><div class="app">
<header class="top"><div><h1>EMECH Interactive Engineering Mechanics Studio</h1><p>Interactive Engineering Mechanics • Problem Solvers • Virtual Experiments • Statics • Dynamics</p></div><span class="badge">OFFLINE • NO API</span></header>
<nav class="tabs" id="tabs"></nav>
<div id="modules"></div></div>
<script>
const $=id=>document.getElementById(id), rad=d=>d*Math.PI/180, fmt=x=>Number(x).toFixed(2);
const App={tab:'forces', tabs:[['forces','Coplanar Forces'],['beam','Beam + SFD/BMD'],['friction','Friction'],['truss','Truss Solver'],['centroid','Centroid'],['inertia','Moment of Inertia'],['motion','Kinematics'],['energy','Work & Energy'],['calculator','Mechanics Calculator']]};
function tabs(){ $('tabs').innerHTML=App.tabs.map(x=>`<button class="tab ${x[0]==App.tab?'active':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join('') }
function show(t){App.tab=t;tabs();document.querySelectorAll('.module').forEach(x=>x.classList.remove('active'));$('m-'+t).classList.add('active');renderModule(t)}
function module(id,title,side,main){return `<section id="m-${id}" class="module ${id==App.tab?'active':''}"><aside>${side}</aside><main>${main}</main></section>`}
const sideForce=`<div class="card"><div class="title">Force Vector Manager <button class="btn primary" onclick="addForce()">+ Force</button></div><div id="forceRows" class="rows"></div><button class="btn primary" style="margin-top:10px" onclick="solveForce()">Resolve Forces</button></div><div class="card"><div class="title">Moment Center</div><div class="grid2"><div class="field"><label>X (m)</label><input class="input" id="mcx" value="0" oninput="solveForce()"></div><div class="field"><label>Y (m)</label><input class="input" id="mcy" value="0" oninput="solveForce()"></div></div><button class="btn primary" style="margin-top:10px" onclick="solveForce()">Submit</button></div>`;const mainForce=`<div class="hero"><b>Interactive 3D coplanar force system</b><br><span class="note">Rotate the view by dragging. Force angles are measured counter-clockwise from +X; application points use metres.</span></div><div class="canvas"><canvas id="forceCanvas" width="900" height="390" tabindex="0" role="img" aria-label="Interactive three-dimensional view of coplanar forces and their resultant"></canvas></div><div class="canvas-help"><div class="legend"><span><i style="background:#38bdf8"></i>Applied forces</span><span><i style="background:#86efac"></i>Resultant</span><span><i style="background:#fb7185"></i>X axis</span><span><i style="background:#4ade80"></i>Y axis</span><span><i style="background:#60a5fa"></i>Z axis</span></div><span class="canvas-note">Drag to orbit · scroll to zoom · arrow keys also rotate</span></div><div style="margin-top:10px"><button class="btn primary" onclick="solveForce()">Resolve Forces</button> <button class="btn" onclick="resetForceView()">Reset View</button></div><div class="outgrid" style="margin-top:12px"><div class="stat"><small>Rx</small><strong id="frx">0</strong></div><div class="stat"><small>Ry</small><strong id="fry">0</strong></div><div class="stat"><small>Resultant R</small><strong id="fR">0</strong></div><div class="stat"><small>Direction</small><strong id="fA">0°</strong></div><div class="stat"><small>Net Moment</small><strong id="fM">0</strong></div></div><div class="card"><div class="title">Exam-Style Solution</div><div id="forceSteps" class="steps"></div></div>`;

function stored(key,fallback){try{const v=JSON.parse(localStorage.getItem(key));return v===null?fallback:v}catch{return fallback}}
function saveStored(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
const defaultForces=[{m:100,a:30,x:0,y:0},{m:150,a:120,x:1,y:0},{m:80,a:225,x:0,y:1},{m:120,a:300,x:1,y:1}];
function forceData(){const data=stored('forces',null);return Array.isArray(data)&&data.length?data:defaultForces.map(f=>({...f}))}
function saveF(data){saveStored('forces',data)}
function forceRows(){const data=forceData();$('forceRows').innerHTML=data.map((f,i)=>'<div class="row"><div class="field"><label>F'+(i+1)+' (N)</label><input class="input" type="number" step="any" value="'+Number(f.m||0)+'" oninput="setF('+i+',\'m\',this.value)"></div><div class="field"><label>Angle (°)</label><input class="input" type="number" step="any" value="'+Number(f.a||0)+'" oninput="setF('+i+',\'a\',this.value)"></div><div class="field"><label>Point x,y (m)</label><input class="input" value="'+Number(f.x||0)+','+Number(f.y||0)+'" aria-label="Application point x,y in metres for force '+(i+1)+'" onchange="setFP('+i+',this.value)"></div><button class="btn danger" aria-label="Remove force '+(i+1)+'" onclick="delF('+i+')">×</button></div>').join('')}
function setF(i,key,value){const data=forceData();const n=Number(value);data[i][key]=Number.isFinite(n)?n:0;saveF(data);solveForce()}
function setFP(i,value){const p=value.split(',').map(Number);if(p.length!==2||!p.every(Number.isFinite))return;const data=forceData();data[i].x=p[0];data[i].y=p[1];saveF(data);solveForce()}
function addForce(){const data=forceData();data.push({m:100,a:45,x:0,y:0});saveF(data);forceRows();solveForce()}
function delF(i){const data=forceData();if(data.length>1){data.splice(i,1);saveF(data);forceRows();solveForce()}}
let forceViz={a:[],Rx:0,Ry:0,yaw:.68,pitch:.48,zoom:1,dragging:false,lastX:0,lastY:0};
function solveForce(){
 const data=forceData();let Rx=0,Ry=0,M=0;const lines=[];
 data.forEach((f,i)=>{const m=Number(f.m)||0,a=Number(f.a)||0,x=Number(f.x)||0,y=Number(f.y)||0,fx=m*Math.cos(rad(a)),fy=m*Math.sin(rad(a));Rx+=fx;Ry+=fy;M+=x*fy-y*fx;lines.push('F'+(i+1)+': Fx = '+fmt(m)+' cos '+fmt(a)+'° = '+fmt(fx)+' N\\n     Fy = '+fmt(m)+' sin '+fmt(a)+'° = '+fmt(fy)+' N')});
 const R=Math.hypot(Rx,Ry),ang=(Math.atan2(Ry,Rx)*180/Math.PI+360)%360,cx=Number($('mcx').value)||0,cy=Number($('mcy').value)||0;
 M=0;data.forEach(f=>{const m=Number(f.m)||0,a=Number(f.a)||0,fx=m*Math.cos(rad(a)),fy=m*Math.sin(rad(a));M+=(Number(f.x||0)-cx)*fy-(Number(f.y||0)-cy)*fx});
 $('frx').textContent=fmt(Rx)+' N';$('fry').textContent=fmt(Ry)+' N';$('fR').textContent=fmt(R)+' N';$('fA').textContent=fmt(ang)+'°';$('fM').textContent=fmt(M)+' N·m';
 $('forceSteps').textContent='Given: '+data.length+' coplanar forces\\n\\n'+lines.join('\\n\\n')+'\\n\\nΣFx = '+fmt(Rx)+' N\\nΣFy = '+fmt(Ry)+' N\\n\\nR = √(Rx² + Ry²) = '+fmt(R)+' N\\nθ = atan2(Ry,Rx) = '+fmt(ang)+'°\\n\\nM about ('+fmt(cx)+','+fmt(cy)+') = Σ[(x−x₀)Fy − (y−y₀)Fx] = '+fmt(M)+' N·m\\n\\nEquilibrium: '+(Math.abs(R)<.01&&Math.abs(M)<.01?'YES':'NO');
 drawForce(data,Rx,Ry)
}
function fitCanvas(id){const c=$(id);if(!c)return null;const rect=c.getBoundingClientRect();if(!rect.width||!rect.height)return null;const dpr=Math.min(window.devicePixelRatio||1,2),width=Math.round(rect.width*dpr),height=Math.round(rect.height*dpr);if(c.width!==width||c.height!==height){c.width=width;c.height=height}const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return{c,g,w:rect.width,h:rect.height}}
function drawForce(data,Rx,Ry){forceViz.a=data.map(f=>({m:Number(f.m)||0,a:Number(f.a)||0,x:Number(f.x)||0,y:Number(f.y)||0}));forceViz.Rx=Rx;forceViz.Ry=Ry;drawForceScene()}
function niceStep(span){const raw=Math.max(span/7,1e-6),power=Math.pow(10,Math.floor(Math.log10(raw))),unit=raw/power;return (unit<1.5?1:unit<3.5?2:unit<7.5?5:10)*power}
function project3(p){const cy=Math.cos(forceViz.yaw),sy=Math.sin(forceViz.yaw),cp=Math.cos(forceViz.pitch),sp=Math.sin(forceViz.pitch),x=p.x*cy-p.y*sy,depth=p.x*sy+p.y*cy;return{x,y:p.z*cp-depth*sp}}
function drawForceScene(){
 const frame=fitCanvas('forceCanvas');if(!frame)return;const g=frame.g,w=frame.w,h=frame.h,forces=forceViz.a;
 g.clearRect(0,0,w,h);const bg=g.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#101b30');bg.addColorStop(1,'#07101e');g.fillStyle=bg;g.fillRect(0,0,w,h);
 let maxCoord=1,maxForce=1;forces.forEach(f=>{maxCoord=Math.max(maxCoord,Math.abs(f.x),Math.abs(f.y));maxForce=Math.max(maxForce,Math.abs(f.m))});
 const vectorScale=maxCoord*.85/maxForce,arrows=forces.map((f,i)=>{const fx=f.m*Math.cos(rad(f.a)),fy=f.m*Math.sin(rad(f.a));return{from:{x:f.x,y:f.y,z:0},to:{x:f.x+fx*vectorScale,y:f.y+fy*vectorScale,z:0},label:'F'+(i+1),color:['#38bdf8','#c084fc','#fbbf24','#fb7185','#2dd4bf','#f472b6'][i%6]}});
 const rTo={x:forceViz.Rx*vectorScale,y:forceViz.Ry*vectorScale,z:0};
 let xMin=Math.min(0,...forces.map(f=>f.x),...arrows.map(a=>a.to.x),rTo.x),xMax=Math.max(0,...forces.map(f=>f.x),...arrows.map(a=>a.to.x),rTo.x);
 let yMin=Math.min(0,...forces.map(f=>f.y),...arrows.map(a=>a.to.y),rTo.y),yMax=Math.max(0,...forces.map(f=>f.y),...arrows.map(a=>a.to.y),rTo.y);
 const padX=Math.max((xMax-xMin)*.18,.5),padY=Math.max((yMax-yMin)*.18,.5);xMin-=padX;xMax+=padX;yMin-=padY;yMax+=padY;
 const axisLen=Math.max(xMax-xMin,yMax-yMin)*.34,world=[{x:0,y:0,z:0},{x:axisLen,y:0,z:0},{x:0,y:axisLen,z:0},{x:0,y:0,z:axisLen},...forces.map(f=>({x:f.x,y:f.y,z:0})),...arrows.map(a=>a.to),rTo];
 let pxs=world.map(project3),minX=Math.min(...pxs.map(p=>p.x)),maxX=Math.max(...pxs.map(p=>p.x)),minY=Math.min(...pxs.map(p=>p.y)),maxY=Math.max(...pxs.map(p=>p.y));
 const scale=Math.min((w-70)/Math.max(maxX-minX,.1),(h-65)/Math.max(maxY-minY,.1))*forceViz.zoom,cx=(minX+maxX)/2,cy=(minY+maxY)/2,ox=w/2,oy=h/2+8;
 const screen=p=>{const q=project3(p);return{x:ox+(q.x-cx)*scale,y:oy-(q.y-cy)*scale}};
 const step=niceStep(Math.max(xMax-xMin,yMax-yMin));
 g.strokeStyle='rgba(148,163,184,.12)';g.lineWidth=1;
 for(let x=Math.ceil(xMin/step)*step,count=0;x<=xMax&&count<24;x+=step,count++){let a=screen({x,y:yMin,z:0}),b=screen({x,y:yMax,z:0});g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
 for(let y=Math.ceil(yMin/step)*step,count=0;y<=yMax&&count<24;y+=step,count++){let a=screen({x:xMin,y,z:0}),b=screen({x:xMax,y,z:0});g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
 const axis=(end,color,label)=>{const a=screen({x:0,y:0,z:0}),b=screen(end);arrow(g,a.x,a.y,b.x,b.y,color,label,2)};
 axis({x:axisLen,y:0,z:0},'#fb7185','X');axis({x:0,y:axisLen,z:0},'#4ade80','Y');axis({x:0,y:0,z:axisLen},'#60a5fa','Z');
 arrows.forEach((a,i)=>{const p=screen(a.from),q=screen(a.to);g.save();g.setLineDash([5,4]);g.strokeStyle='rgba(226,232,240,.32)';g.lineWidth=1;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(ox,oy);g.stroke();g.restore();arrow(g,p.x,p.y,q.x,q.y,a.color,a.label,2);g.fillStyle=a.color;g.beginPath();g.arc(p.x,p.y,4,0,Math.PI*2);g.fill();g.fillStyle='#e2e8f0';g.font='11px system-ui';g.fillText('P'+(i+1),p.x+7,p.y+14)});
 const o=screen({x:0,y:0,z:0}),r=screen(rTo);if(Math.hypot(forceViz.Rx,forceViz.Ry)>.0001)arrow(g,o.x,o.y,r.x,r.y,'#86efac','R',2);
 g.fillStyle='rgba(226,232,240,.9)';g.font='600 12px system-ui';g.fillText('3D VIEW · '+forces.length+' FORCE'+(forces.length===1?'':'S'),16,22);
 g.fillStyle='rgba(148,163,184,.8)';g.font='11px system-ui';g.fillText('XY force plane · Z axis shown for orientation',16,h-14);
}
function arrow(g,x1,y1,x2,y2,color,label,width){
 g.save();const angle=Math.atan2(y2-y1,x2-x1),head=10;g.strokeStyle=color;g.fillStyle=color;g.lineWidth=width||2;g.lineCap='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-head*Math.cos(angle-.48),y2-head*Math.sin(angle-.48));g.lineTo(x2-head*Math.cos(angle+.48),y2-head*Math.sin(angle+.48));g.closePath();g.fill();if(label){g.fillStyle='#f8fafc';g.font='600 12px system-ui';g.fillText(label,x2+7,y2-7)}g.restore()
}
function resetForceView(){forceViz.yaw=.68;forceViz.pitch=.48;forceViz.zoom=1;drawForceScene()}
function bindForceCanvas(){
 const c=$('forceCanvas');if(!c)return;
 c.addEventListener('pointerdown',e=>{forceViz.dragging=true;forceViz.lastX=e.clientX;forceViz.lastY=e.clientY;c.setPointerCapture(e.pointerId)});
 c.addEventListener('pointermove',e=>{if(!forceViz.dragging)return;const dx=e.clientX-forceViz.lastX,dy=e.clientY-forceViz.lastY;forceViz.lastX=e.clientX;forceViz.lastY=e.clientY;forceViz.yaw+=dx*.009;forceViz.pitch=Math.max(-1.35,Math.min(1.35,forceViz.pitch+dy*.008));drawForceScene()});
 c.addEventListener('pointerup',()=>{forceViz.dragging=false});c.addEventListener('pointercancel',()=>{forceViz.dragging=false});
 c.addEventListener('wheel',e=>{e.preventDefault();forceViz.zoom=Math.max(.55,Math.min(2.6,forceViz.zoom*(e.deltaY<0?1.1:.9)));drawForceScene()},{passive:false});
 c.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')forceViz.yaw-=.12;else if(e.key==='ArrowRight')forceViz.yaw+=.12;else if(e.key==='ArrowUp')forceViz.pitch=Math.min(1.35,forceViz.pitch+.1);else if(e.key==='ArrowDown')forceViz.pitch=Math.max(-1.35,forceViz.pitch-.1);else if(e.key==='Home')return resetForceView();else return; e.preventDefault();drawForceScene()})
}

const sideBeam=`<div class="card"><div class="title">Beam Parameters</div><div class="grid2"><div class="field"><label>Span L (m)</label><input class="input" type="number" min="0.01" step="any" id="L" value="10" oninput="solveBeam()"></div><div class="mini">Loads in kN · moments in kN·m</div></div><button class="btn primary" style="margin-top:10px" onclick="solveBeam()">Submit Parameters</button></div><div class="card"><div class="title">Loads <button class="btn primary" onclick="addBeam()">+ Load</button></div><div id="beamRows" class="rows"></div><button class="btn primary" style="margin-top:10px" onclick="solveBeam()">Submit & Solve</button></div>`;const mainBeam=`<div class="hero"><b>Simply supported beam</b><br><span class="note">A = pin, B = roller. Point loads, UDL, UVL and couples are supported.</span></div><div class="canvas"><canvas id="beamCanvas" width="900" height="390"></canvas></div><div class="outgrid" style="margin-top:12px"><div class="stat"><small>RAy</small><strong id="RA">0</strong></div><div class="stat"><small>RBy</small><strong id="RB">0</strong></div><div class="stat"><small>RAx</small><strong id="RAx">0</strong></div><div class="stat"><small>Total load</small><strong id="BL">0</strong></div></div><div class="card"><div class="title">Shear Force Diagram</div><div class="canvas"><canvas id="sfd" width="900" height="300"></canvas></div></div><div class="card"><div class="title">Bending Moment Diagram</div><div class="canvas"><canvas id="bmd" width="900" height="300"></canvas></div></div><div class="card"><div class="title">Exam-Style Calculation</div><div id="beamSteps" class="steps"></div></div>`;

function normalizedBeamLoads(loads,L){return loads.map(q=>{const item={...q};if(item.t==='point'||item.t==='couple'){item.x=Math.max(0,Math.min(L,Number(item.x)||0));return item}const a=Math.max(0,Math.min(L,Number(item.x)||0)),b=Math.max(0,Math.min(L,Number(item.x2)||0));item.x=Math.min(a,b);item.x2=Math.max(a,b);return item})}

function solveBeam(){const L=Math.max(Number($('L').value)||10,.01),raw=beamData(),r=beamEquivalent(L,raw),loads=r.loads;$('RA').textContent=fmt(r.RA)+' kN';$('RB').textContent=fmt(r.RB)+' kN';$('RAx').textContent='0 kN';$('BL').textContent=fmt(r.V)+' kN';$('beamSteps').textContent='Take moments about A (counter-clockwise positive):\\nΣMA = 0\\nRBy × '+fmt(L)+' − (downward-load moments) + (applied couples) = 0\\nRBy = '+fmt(r.RB)+' kN\\n\\nVertical equilibrium:\\nΣFy = 0\\nRAy + RBy − '+fmt(r.V)+' = 0\\nRAy = '+fmt(r.RA)+' kN\\n\\nCheck: RAy + RBy = '+fmt(r.RA+r.RB)+' kN';drawBeam(L,loads,r);drawDiagram('sfd',L,loads,r,false);drawDiagram('bmd',L,loads,r,true)}
function drawBeam(L,loads,r){const frame=fitCanvas('beamCanvas');if(!frame)return;const {g,w,h}=frame;g.clearRect(0,0,w,h);const m=Math.min(62,w*.1),y=h*.67,p=(w-2*m)/L;g.strokeStyle='#475569';g.lineWidth=Math.max(8,h*.035);g.beginPath();g.moveTo(m,y);g.lineTo(m+L*p,y);g.stroke();arrow(g,m,y+48,m,y-5,'#16a34a','RA',2);arrow(g,m+L*p,y+48,m+L*p,y-5,'#16a34a','RB',2);loads.forEach((q,i)=>{if(q.t==='point'){const x=m+q.x*p;arrow(g,x,y-66,x,y-7,'#dc2626','P'+(i+1),2)}else if(q.t==='udl'||q.t==='uvl'){const x1=m+q.x*p,x2=m+q.x2*p,n=Math.max(2,Math.min(26,Math.round((x2-x1)/25)));for(let k=0;k<=n;k++){const ratio=k/n,x=x1+ratio*(x2-x1),drop=q.t==='uvl'?24+32*ratio:48;arrow(g,x,y-drop,x,y-7,'#dc2626','',1.5)}g.fillStyle='#334155';g.font='12px system-ui';g.fillText(q.t.toUpperCase()+': '+q.v+' kN/m',x1,y-58)}else{const x=m+q.x*p;g.strokeStyle='#d97706';g.lineWidth=2;g.beginPath();g.arc(x,y,20,Math.PI*.15,Math.PI*1.75);g.stroke();g.fillStyle='#334155';g.font='12px system-ui';g.fillText('M '+q.v,x+22,y-14)}});g.fillStyle='#475569';g.font='12px system-ui';g.fillText('A · pin',m-18,y+68);g.fillText('B · roller',m+L*p-28,y+68);g.fillText('L = '+fmt(L)+' m',w/2-28,h-12)}
function beamValueAt(x,loads,r,bmd){let V=r.RA,M=r.RA*x;for(const q of loads){if(q.t==='point'&&x>=q.x){V-=q.v;M-=q.v*(x-q.x)}else if(q.t==='udl'&&x>q.x){const len=Math.max(0,Math.min(x,q.x2)-q.x),P=q.v*len;V-=P;M-=P*(x-q.x-len/2)}else if(q.t==='uvl'&&x>q.x){const full=q.x2-q.x,len=Math.max(0,Math.min(x,q.x2)-q.x),P=full?(.5*q.v*len*len/full):0;V-=P;M-=P*(x-q.x-2*len/3)}else if(q.t==='couple'&&x>=q.x)M-=q.v}return bmd?M:V}
function diagramData(L,loads,r,bmd){const xs=Array.from({length:121},(_,i)=>L*i/120),eps=Math.max(L*1e-8,1e-9);loads.forEach(q=>{if(q.t==='point'||q.t==='couple'){const x=q.x;xs.push(Math.max(0,x-eps),x)}});xs.sort((a,b)=>a-b);return xs.map(x=>({x,v:beamValueAt(x,loads,r,bmd)}))}

const sideFric=`<div class="card"><div class="title">Inclined Plane</div><div class="field"><label>Mass (kg)</label><input class="input" id="fm" type="range" min="1" max="100" value="10" oninput="solveFriction()"></div><div class="field"><label>Angle θ</label><input class="input" id="fa" type="range" min="0" max="60" value="15" oninput="solveFriction()"></div><div class="field"><label>μs</label><input class="input" id="mu" type="range" min=".05" max=".9" step=".01" value=".4" oninput="solveFriction()"></div><button class="btn primary" style="margin-top:10px" onclick="solveFriction()">Submit & Solve</button></div>`;const mainFric=`<div class="canvas"><canvas id="fricCanvas" width="900" height="390"></canvas></div><div class="outgrid" style="margin-top:12px"><div class="stat"><small>Normal N</small><strong id="FN"></strong></div><div class="stat"><small>Limiting friction</small><strong id="FF"></strong></div><div class="stat"><small>Weight component ∥</small><strong id="FP"></strong></div><div class="stat"><small>Angle of repose</small><strong id="FR"></strong></div></div><div class="card"><div class="title">Step-by-Step</div><div id="fricSteps" class="steps"></div></div>`;

function solveFriction(){const m=Number($('fm').value),th=Number($('fa').value),mu=Number($('mu').value),W=m*9.81,N=W*Math.cos(rad(th)),P=W*Math.sin(rad(th)),F=mu*N,re=Math.atan(mu)*180/Math.PI,tol=1e-8;$('FN').textContent=fmt(N)+' N';$('FF').textContent=fmt(F)+' N';$('FP').textContent=fmt(P)+' N';$('FR').textContent=fmt(re)+'°';const state=P<F-tol?'STATIC EQUILIBRIUM':Math.abs(P-F)<=tol?'IMPENDING MOTION':'SLIDING';$('fricSteps').textContent='W = mg = '+m+' × 9.81 = '+fmt(W)+' N\\nN = W cosθ = '+fmt(N)+' N\\nDown-slope component = W sinθ = '+fmt(P)+' N\\nLimiting friction = μsN = '+fmt(F)+' N\\nAngle of repose = tan⁻¹(μs) = '+fmt(re)+'°\\n\\nState: '+state;drawIncline(th)}

const sideTruss=`<div class="card"><div class="title">Triangle Truss</div><p class="note">Loads act downward at joint B. Pin at A, roller at C.</p><div class="grid2"><div class="field"><label>Span AC (m)</label><input class="input" type="number" min="0.01" step="any" id="ts" value="4" oninput="solveTruss()"></div><div class="field"><label>Height (m)</label><input class="input" type="number" min="0.01" step="any" id="th" value="3" oninput="solveTruss()"></div><div class="field"><label>Load at B (kN)</label><input class="input" id="tl" value="10" oninput="solveTruss()"></div></div><button class="btn primary" style="margin-top:10px" onclick="solveTruss()">Submit & Solve</button></div>`;const mainTruss=`<div class="canvas"><canvas id="trussCanvas" width="900" height="390"></canvas></div><div class="outgrid" style="margin-top:12px"><div class="stat"><small>RAy</small><strong id="tRA"></strong></div><div class="stat"><small>RCy</small><strong id="tRC"></strong></div><div class="stat"><small>AB</small><strong id="tAB"></strong></div><div class="stat"><small>BC</small><strong id="tBC"></strong></div><div class="stat"><small>AC</small><strong id="tAC"></strong></div></div><div class="card"><div class="title">Method of Joints — Calculation</div><div id="trussSteps" class="steps"></div></div>`;

function solveTruss(){const s=Number($('ts').value||4),hgt=Number($('th').value||3),P=Number($('tl').value||0);if(!Number.isFinite(s)||!Number.isFinite(hgt)||s<=0||hgt<=0){$('trussSteps').textContent='Span and height must be greater than zero.';return}const half=s/2,L=Math.hypot(half,hgt),sin=hgt/L,cos=half/L,RC=P/2,RA=RC,Fab=-RC/sin,Fbc=Fab,FAC=-(Fab*cos);$('tRA').textContent=fmt(RA)+' kN';$('tRC').textContent=fmt(RC)+' kN';$('tAB').textContent=fmt(Fab)+' kN';$('tBC').textContent=fmt(Fbc)+' kN';$('tAC').textContent=fmt(FAC)+' kN';$('trussSteps').textContent='By symmetry:\\nRAy = RCy = P/2 = '+fmt(RA)+' kN\\n\\nAt joint B:\\nΣFy = 0 → 2FAB sinθ = P\\nsinθ = '+fmt(sin)+'\\nFAB = '+fmt(Fab)+' kN → COMPRESSION\\nFBC = '+fmt(Fbc)+' kN → COMPRESSION\\nFAC = '+fmt(FAC)+' kN → TENSION';drawTruss(s,hgt)}
function drawTruss(span,height){const frame=fitCanvas('trussCanvas');if(!frame)return;const {g,w,h}=frame;g.clearRect(0,0,w,h);const margin=Math.min(w*.14,110),base=h*.8,scale=Math.min((w-2*margin)/span,(base-h*.16)/height),halfPx=span*scale/2;const A=[w/2-halfPx,base],C=[w/2+halfPx,base],B=[w/2,base-height*scale];g.strokeStyle='#334155';g.lineWidth=4;[[A,B],[B,C],[A,C]].forEach(e=>{g.beginPath();g.moveTo(e[0][0],e[0][1]);g.lineTo(e[1][0],e[1][1]);g.stroke()});[A,B,C].forEach((p,i)=>{g.fillStyle='#2563eb';g.beginPath();g.arc(p[0],p[1],7,0,Math.PI*2);g.fill();g.fillStyle='#172033';g.font='bold 13px system-ui';g.fillText(['A','B','C'][i],p[0]-4,p[1]+23)});arrow(g,B[0],B[1]-58,B[0],B[1]-7,'#dc2626','P',2)}

const sideCent=`<div class="card"><div class="title">Composite Area</div><p class="note">Enter signed area (negative values represent cut-outs) and each part’s centroid coordinates.</p><div id="centRows" class="rows"></div><button class="btn primary" onclick="addCent()">+ Shape</button><button class="btn primary" style="margin-top:10px" onclick="solveCent()">Submit & Solve</button></div>`;const mainCent=`<div class="canvas"><canvas id="centCanvas" width="900" height="390"></canvas></div><div class="outgrid" style="margin-top:12px"><div class="stat"><small>Total area</small><strong id="CA"></strong></div><div class="stat"><small>Centroid X̄</small><strong id="CX"></strong></div><div class="stat"><small>Centroid Ȳ</small><strong id="CY"></strong></div></div><div class="card"><div class="title">Centroid Calculation</div><div id="centSteps" class="steps"></div></div>`;
const defaultCent=[{t:'rect',a:4,x:1,y:1},{t:'circle',a:Math.PI,x:3,y:1}];function centData(){const a=stored('cent',null);return Array.isArray(a)&&a.length?a:defaultCent.map(q=>({...q}))}function saveC(a){saveStored('cent',a)}function centRows(){let a=centData();$('centRows').innerHTML=a.map((q,i)=>`<div class="card" style="padding:8px"><div class="grid2"><div class="field"><label>Shape</label><select class="input" onchange="setC(${i},'t',this.value)"><option value="rect" ${q.t=='rect'?'selected':''}>Rectangle (area input)</option><option value="circle" ${q.t=='circle'?'selected':''}>Circle (area input)</option><option value="triangle" ${q.t=='triangle'?'selected':''}>Triangle (area input)</option></select></div><div class="field"><label>Signed area</label><input class="input" type="number" step="any" value="${q.a}" oninput="setC(${i},'a',this.value)"></div><div class="field"><label>X centroid</label><input class="input" value="${q.x}" oninput="setC(${i},'x',this.value)"></div><div class="field"><label>Y centroid</label><input class="input" value="${q.y}" oninput="setC(${i},'y',this.value)"></div></div><button class="btn danger" onclick="delC(${i})">Remove</button></div>`).join('')};function setC(i,k,v){let a=centData();a[i][k]=k=='t'?v:(Number(v)||0);saveC(a);if(k=='t')centRows();solveCent()}function addCent(){let a=centData();a.push({t:'rect',a:2,x:2,y:2});saveC(a);centRows();solveCent()}function delC(i){let a=centData();if(a.length>1){a.splice(i,1);saveC(a);centRows();solveCent()}}
function solveCent(){const a=centData(),A=a.reduce((sum,q)=>sum+(Number(q.a)||0),0);if(Math.abs(A)<1e-10){$('CA').textContent='0 units²';$('CX').textContent='—';$('CY').textContent='—';$('centSteps').textContent='The signed areas sum to zero, so the centroid is undefined.';drawCentroid(a,null,null);return}const X=a.reduce((sum,q)=>sum+(Number(q.a)||0)*(Number(q.x)||0),0)/A,Y=a.reduce((sum,q)=>sum+(Number(q.a)||0)*(Number(q.y)||0),0)/A;$('CA').textContent=fmt(A)+' units²';$('CX').textContent=fmt(X);$('CY').textContent=fmt(Y);$('centSteps').textContent=a.map((q,i)=>'A'+(i+1)+' = '+fmt(q.a)+', x'+(i+1)+' = '+fmt(q.x)+', y'+(i+1)+' = '+fmt(q.y)+'\\nA x = '+fmt(q.a*q.x)+', A y = '+fmt(q.a*q.y)).join('\\n\\n')+'\\n\\nX̄ = Σ(Ax)/ΣA = '+fmt(X)+'\\nȲ = Σ(Ay)/ΣA = '+fmt(Y);drawCentroid(a,X,Y)}
function drawCentroid(parts,X,Y){const frame=fitCanvas('centCanvas');if(!frame)return;const {g,w,h}=frame;g.clearRect(0,0,w,h);const xs=parts.map(q=>Number(q.x)||0),ys=parts.map(q=>Number(q.y)||0);if(X!==null){xs.push(X);ys.push(Y)}let xmin=Math.min(0,...xs),xmax=Math.max(1,...xs),ymin=Math.min(0,...ys),ymax=Math.max(1,...ys);const pad=.18*Math.max(xmax-xmin,ymax-ymin,1);xmin-=pad;xmax+=pad;ymin-=pad;ymax+=pad;const m=42,sc=Math.min((w-2*m)/(xmax-xmin),(h-2*m)/(ymax-ymin)),px=x=>m+(x-xmin)*sc,py=y=>h-m-(y-ymin)*sc;g.strokeStyle='#94a3b8';g.lineWidth=1;g.beginPath();g.moveTo(px(xmin),py(0));g.lineTo(px(xmax),py(0));g.moveTo(px(0),py(ymin));g.lineTo(px(0),py(ymax));g.stroke();parts.forEach((q,i)=>{const x=px(Number(q.x)||0),y=py(Number(q.y)||0);g.fillStyle=(Number(q.a)||0)<0?'#f97316':'#2563eb';g.beginPath();g.arc(x,y,6,0,Math.PI*2);g.fill();g.font='12px system-ui';g.fillStyle='#334155';g.fillText('A'+(i+1),x+8,y-7)});if(X!==null){const x=px(X),y=py(Y);g.fillStyle='#dc2626';g.beginPath();g.arc(x,y,8,0,Math.PI*2);g.fill();g.font='bold 12px system-ui';g.fillText('Centroid ('+fmt(X)+', '+fmt(Y)+')',x+10,y-9)}}

const sideInertia=`<div class="card"><div class="title">Section</div><div class="field"><label>Shape</label><select class="input" id="ishape" onchange="solveInertia()"><option value="rect">Rectangle</option><option value="circle">Circle</option><option value="hollow">Hollow Circle</option></select></div><div class="grid2" style="margin-top:9px"><div class="field"><label>b / D outer (mm)</label><input class="input" type="number" min="0" step="any" id="id1" value="100" oninput="solveInertia()"></div><div class="field"><label>h / d inner (mm)</label><input class="input" type="number" min="0" step="any" id="id2" value="50" oninput="solveInertia()"></div></div><button class="btn primary" style="margin-top:10px" onclick="solveInertia()">Submit & Solve</button></div>`;const mainInertia=`<div class="canvas"><canvas id="inCanvas" width="900" height="390"></canvas></div><div class="outgrid" style="margin-top:12px"><div class="stat"><small>Ix</small><strong id="IX"></strong></div><div class="stat"><small>Iy</small><strong id="IY"></strong></div><div class="stat"><small>J (if circular)</small><strong id="IJ"></strong></div></div><div class="card"><div class="title">Formula</div><div id="inSteps" class="formula"></div></div>`;

function drawInertia(shape,a,b){const frame=fitCanvas('inCanvas');if(!frame)return;const {g,w,h}=frame;g.clearRect(0,0,w,h);const m=62,cx=w/2,cy=h/2+4,outer=shape==='rect'?Math.max(a,b):a,scale=Math.min((w-2*m)/Math.max(outer,1),(h-2*m)/Math.max(outer,1))*.72;g.strokeStyle='#94a3b8';g.lineWidth=1;g.beginPath();g.moveTo(m,cy);g.lineTo(w-m,cy);g.moveTo(cx,m*.55);g.lineTo(cx,h-m*.55);g.stroke();g.fillStyle='#dbeafe';g.strokeStyle='#2563eb';g.lineWidth=3;if(shape==='rect'){const rw=a*scale,rh=b*scale;g.fillRect(cx-rw/2,cy-rh/2,rw,rh);g.strokeRect(cx-rw/2,cy-rh/2,rw,rh);g.fillStyle='#334155';g.font='12px system-ui';g.fillText('b = '+fmt(a)+' mm',cx-rw/2,cy+rh/2+22);g.fillText('h = '+fmt(b)+' mm',cx+rw/2+8,cy)}else{g.beginPath();g.arc(cx,cy,a*scale/2,0,Math.PI*2);g.fill();g.stroke();if(shape==='hollow'){g.fillStyle='#fff';g.beginPath();g.arc(cx,cy,b*scale/2,0,Math.PI*2);g.fill();g.stroke();g.fillStyle='#334155';g.font='12px system-ui';g.fillText('D = '+fmt(a)+' mm · d = '+fmt(b)+' mm',cx-a*scale/2,cy+a*scale/2+22)}else{g.fillStyle='#334155';g.font='12px system-ui';g.fillText('D = '+fmt(a)+' mm',cx-a*scale/2,cy+a*scale/2+22)}}g.fillStyle='#dc2626';g.beginPath();g.arc(cx,cy,4,0,Math.PI*2);g.fill();g.fillStyle='#475569';g.font='11px system-ui';g.fillText('centroidal axes',m,18)}
function solveInertia(){const shape=$('ishape').value,a=Number($('id1').value),b=Number($('id2').value);if(!(a>0)||((shape==='hollow')&&(!(b>0)||b>=a))||((shape==='rect')&&!(b>0))){$('IX').textContent='—';$('IY').textContent='—';$('IJ').textContent='—';const message=shape==='hollow'?'Enter D > d > 0.':'Enter positive dimensions.';$('inSteps').textContent=message;const frame=fitCanvas('inCanvas');if(frame){frame.g.clearRect(0,0,frame.w,frame.h);frame.g.fillStyle='#667085';frame.g.font='14px system-ui';frame.g.fillText(message,24,34)}return}let Ix,Iy,J=null,form;if(shape==='rect'){Ix=a*b**3/12;Iy=b*a**3/12;form='Rectangle: Ix = b h³/12; Iy = h b³/12'}else if(shape==='circle'){Ix=Math.PI*a**4/64;Iy=Ix;J=2*Ix;form='Circle: I = πD⁴/64; J = πD⁴/32'}else{Ix=Math.PI*(a**4-b**4)/64;Iy=Ix;J=2*Ix;form='Hollow circle: I = π(D⁴−d⁴)/64; J = π(D⁴−d⁴)/32'}$('IX').textContent=fmt(Ix)+' mm⁴';$('IY').textContent=fmt(Iy)+' mm⁴';$('IJ').textContent=J===null?'—':fmt(J)+' mm⁴';$('inSteps').textContent=form+'\\n\\nIx = '+fmt(Ix)+' mm⁴\\nIy = '+fmt(Iy)+' mm⁴'+(J===null?'\\nPolar moment J is shown for circular sections only.':'\\nJ = '+fmt(J)+' mm⁴');drawInertia(shape,a,b)}

const sideMotion=`<div class="card"><div class="title">Kinematics</div><div class="grid2"><div class="field"><label>Initial velocity u (m/s)</label><input class="input" id="u" value="0" oninput="solveMotion()"></div><div class="field"><label>Acceleration a (m/s²)</label><input class="input" id="acc" value="9.81" oninput="solveMotion()"></div><div class="field"><label>Time t (s)</label><input class="input" id="tm" value="2" oninput="solveMotion()"></div></div><button class="btn primary" style="margin-top:10px" onclick="solveMotion()">Submit & Solve</button></div>`;const mainMotion=`<div class="outgrid"><div class="stat"><small>Final velocity v</small><strong id="mv"></strong></div><div class="stat"><small>Displacement s</small><strong id="ms"></strong></div><div class="stat"><small>Equation check</small><strong id="mc"></strong></div></div><div class="card"><div class="title">Step-by-Step</div><div id="motionSteps" class="steps"></div></div>`;function solveMotion(){let u=+$('u').value,a=+$('acc').value,t=+$('tm').value,v=u+a*t,s=u*t+.5*a*t*t,vc=u*u+2*a*s;$('mv').textContent=fmt(v)+' m/s';$('ms').textContent=fmt(s)+' m';$('mc').textContent=fmt(vc)+' = v²';$('motionSteps').textContent=`v = u + at\n= ${u} + (${a})(${t})\n= ${fmt(v)} m/s\n\ns = ut + ½at²\n= (${u})(${t}) + ½(${a})(${t})²\n= ${fmt(s)} m\n\nCheck: v² = u² + 2as`}
const sideEnergy=`<div class="card"><div class="title">Work–Energy</div><div class="grid2"><div class="field"><label>Force F (N)</label><input class="input" id="ef" value="100" oninput="solveEnergy()"></div><div class="field"><label>Distance s (m)</label><input class="input" id="es" value="5" oninput="solveEnergy()"></div><div class="field"><label>Angle θ</label><input class="input" id="ea" value="0" oninput="solveEnergy()"></div><div class="field"><label>Mass (kg)</label><input class="input" type="number" min="0.01" step="any" id="em" value="10" oninput="solveEnergy()"></div><div class="field"><label>Initial speed u (m/s)</label><input class="input" type="number" min="0" step="any" id="eu" value="0" oninput="solveEnergy()"></div></div><button class="btn primary" style="margin-top:10px" onclick="solveEnergy()">Submit & Solve</button></div>`;const mainEnergy=`<div class="outgrid"><div class="stat"><small>Work</small><strong id="EW"></strong></div><div class="stat"><small>Work-energy speed</small><strong id="EV"></strong></div><div class="stat"><small>Kinetic energy gained</small><strong id="EK"></strong></div></div><div class="card"><div class="title">Calculation</div><div id="energySteps" class="steps"></div></div>`;
function solveEnergy(){const F=Number($('ef').value),s=Number($('es').value),t=Number($('ea').value),m=Number($('em').value),u=Number($('eu').value),W=F*s*Math.cos(rad(t)),KE0=.5*m*u*u,KEf=KE0+W,v=KEf>=0&&m>0?Math.sqrt(2*KEf/m):null;$('EW').textContent=fmt(W)+' J';$('EK').textContent=fmt(W)+' J';$('EV').textContent=v===null?'No real speed':fmt(v)+' m/s';$('energySteps').textContent='W = Fs cosθ\\n= '+F+' × '+s+' × cos('+t+'°)\\n= '+fmt(W)+' J\\n\\nW = ΔKE = ½m(v² − u²)\\nInitial KE = '+fmt(KE0)+' J\\nFinal speed v = '+(v===null?'not physically possible with this work and initial speed':fmt(v)+' m/s')}

const sideCalc=`<div class="card"><div class="title">Vector Calculator</div><div class="grid2"><div class="field"><label>F1</label><input class="input" id="c1" value="100"></div><div class="field"><label>Angle 1</label><input class="input" id="ca1" value="30"></div><div class="field"><label>F2</label><input class="input" id="c2" value="100"></div><div class="field"><label>Angle 2</label><input class="input" id="ca2" value="150"></div></div><button class="btn primary" style="margin-top:10px" onclick="calc()">Submit & Calculate</button></div>`;const mainCalc=`<div class="outgrid"><div class="stat"><small>Rx</small><strong id="CRx"></strong></div><div class="stat"><small>Ry</small><strong id="CRy"></strong></div><div class="stat"><small>Resultant</small><strong id="CR"></strong></div><div class="stat"><small>Direction</small><strong id="Cang"></strong></div></div><div class="card"><div class="title">Formula</div><div id="calcSteps" class="steps"></div></div>`;function calc(){let f1=+$('c1').value,a1=+$('ca1').value,f2=+$('c2').value,a2=+$('ca2').value,Rx=f1*Math.cos(rad(a1))+f2*Math.cos(rad(a2)),Ry=f1*Math.sin(rad(a1))+f2*Math.sin(rad(a2)),R=Math.hypot(Rx,Ry),a=(Math.atan2(Ry,Rx)*180/Math.PI+360)%360;$('CRx').textContent=fmt(Rx)+' N';$('CRy').textContent=fmt(Ry)+' N';$('CR').textContent=fmt(R)+' N';$('Cang').textContent=fmt(a)+'°';$('calcSteps').textContent=`ΣFx = F1 cosθ1 + F2 cosθ2 = ${fmt(Rx)} N\nΣFy = F1 sinθ1 + F2 sinθ2 = ${fmt(Ry)} N\nR = √(Rx²+Ry²) = ${fmt(R)} N\nθ = tan⁻¹(Ry/Rx) = ${fmt(a)}°`}
function renderModule(t){const render={forces:solveForce,beam:solveBeam,friction:solveFriction,truss:solveTruss,centroid:solveCent,inertia:solveInertia,motion:solveMotion,energy:solveEnergy,calculator:calc};if(render[t])render[t]()}
window.addEventListener('resize',()=>renderModule(App.tab));
const all=module('forces','',sideForce,mainForce)+module('beam','',sideBeam,mainBeam)+module('friction','',sideFric,mainFric)+module('truss','',sideTruss,mainTruss)+module('centroid','',sideCent,mainCent)+module('inertia','',sideInertia,mainInertia)+module('motion','',sideMotion,mainMotion)+module('energy','',sideEnergy,mainEnergy)+module('calculator','',sideCalc,mainCalc);$('modules').innerHTML=all;tabs();bindForceCanvas();forceRows();beamRows();centRows();solveForce();solveBeam();solveFriction();solveTruss();solveCent();solveInertia();solveMotion();solveEnergy();calc();
</script></body></html>
